<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu – SmartFood</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="logo">
      <div class="logo-icon">🍔</div>
      <span class="logo-text">Smart<span>Food</span></span>
    </a>
    <div class="nav-search">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="Search in menu..." oninput="filterMenu(this.value)">
    </div>
    <div class="nav-actions">
      <a href="offers.html" class="nav-btn btn-ghost" style="color:#FC8019;"><i class="fas fa-tag"></i> <span>Offers</span></a>
      <a href="dashboard.html" class="nav-btn btn-ghost" id="dashBtn" style="display:none;"><i class="fas fa-th-large"></i> <span>Dashboard</span></a>
      <a href="login.html" class="nav-btn btn-ghost" id="loginBtn"><i class="fas fa-user"></i> <span>Login</span></a>
      <div id="userMenu" style="display:none;align-items:center;gap:10px;">
        <a href="dashboard.html" style="font-weight:700;font-size:0.9rem;color:var(--text-mid);text-decoration:none;">Hi, <span id="userName"></span>! <i class="fas fa-th-large" style="color:var(--primary);font-size:0.8rem;"></i></a>
        <button class="nav-btn btn-ghost" onclick="AUTH.logout()" style="font-size:0.82rem;padding:7px 14px;"><i class="fas fa-sign-out-alt"></i></button>
      </div>
      <a href="cart.html" class="cart-btn">
        <i class="fas fa-shopping-cart"></i> Cart
        <span class="cart-count" id="cartCount" style="display:none;">0</span>
      </a>
    </div>
  </div>
</nav>

<!-- RESTAURANT HEADER -->
<div id="restaurantHeader"></div>

<section class="section">
  <div class="section-inner">
    <!-- Filter pills -->
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;">
      <button class="category-pill active" onclick="filterMenuType('all', this)">🍽️ All</button>
      <button class="category-pill" onclick="filterMenuType('veg', this)">🌿 Veg Only</button>
      <button class="category-pill" onclick="filterMenuType('nonveg', this)">🍗 Non-Veg</button>
      <button class="category-pill" onclick="filterMenuType('popular', this)">🔥 Popular</button>
    </div>

    <div class="food-grid" id="menuGrid"></div>
  </div>
</section>

<!-- Floating Cart Bar (shows when cart has items) -->
<div id="floatingCart" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary);color:white;padding:16px 28px;border-radius:50px;box-shadow:var(--shadow-lg);font-weight:800;cursor:pointer;z-index:999;display:none;align-items:center;gap:12px;animation:slideInToast 0.3s ease;" onclick="window.location.href='cart.html'">
  <span id="floatingCartCount" style="background:white;color:var(--primary);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.85rem;">0</span>
  <span>View Cart</span>
  <span id="floatingCartTotal">₹0</span>
  <i class="fas fa-arrow-right"></i>
</div>

<script src="js/auth.js"></script>
<script src="js/menu.js"></script>
<script src="js/cart.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const rid = parseInt(params.get('restaurant')) || 1;
  const restaurant = RESTAURANTS.find(r => r.id === rid);

  document.addEventListener('DOMContentLoaded', () => {
    if (!restaurant) { window.location.href = 'restaurants.html'; return; }
    document.title = restaurant.name + ' – SmartFood';

    // Restaurant Header
    document.getElementById('restaurantHeader').innerHTML = `
      <div style="background:${restaurant.gradient};padding:40px 5%;position:relative;overflow:hidden;">
        <div style="position:absolute;inset:0;background:rgba(0,0,0,0.45);"></div>
        <div style="max-width:1280px;margin:0 auto;position:relative;">
          <div style="color:rgba(255,255,255,0.7);font-size:0.88rem;margin-bottom:10px;"><a href="index.html" style="color:rgba(255,255,255,0.8);text-decoration:none;">Home</a> / <a href="restaurants.html" style="color:rgba(255,255,255,0.8);text-decoration:none;">Restaurants</a> / ${restaurant.name}</div>
          <div style="display:flex;align-items:center;gap:20px;">
            <div style="font-size:60px;">${restaurant.emoji}</div>
            <div>
              <h1 style="color:white;font-family:var(--font-display);font-size:2rem;font-weight:800;">${restaurant.name}</h1>
              <p style="color:rgba(255,255,255,0.8);margin:4px 0;">${restaurant.cuisine}</p>
              <div style="display:flex;gap:16px;margin-top:10px;">
                <span style="background:rgba(255,255,255,0.15);color:white;padding:4px 12px;border-radius:20px;font-size:0.82rem;font-weight:700;"><i class="fas fa-star" style="color:#ffd700;"></i> ${restaurant.rating}</span>
                <span style="background:rgba(255,255,255,0.15);color:white;padding:4px 12px;border-radius:20px;font-size:0.82rem;font-weight:700;"><i class="fas fa-clock"></i> ${restaurant.deliveryTime}</span>
                ${restaurant.discount ? `<span style="background:var(--danger);color:white;padding:4px 12px;border-radius:20px;font-size:0.82rem;font-weight:700;">${restaurant.discount}</span>` : ''}
              </div>
            </div>
          </div>
        </div>
      </div>
    `;

    renderFoodItems(document.getElementById('menuGrid'), rid);
    updateFloatingCart();
  });

  let currentType = 'all';

  function filterMenuType(type, btn) {
    currentType = type;
    document.querySelectorAll('.category-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const items = FOOD_ITEMS[rid] || [];
    let filtered = type === 'all' ? items : type === 'popular' ? items.filter(i => i.popular) : items.filter(i => i.type === type);
    const grid = document.getElementById('menuGrid');
    grid.innerHTML = '';
    filtered.forEach(item => {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      const inCart = cart.find(c => c.id === item.id);
      const card = document.createElement('div');
      card.className = 'food-card';
      card.innerHTML = `
        <div style="position:relative;height:170px;overflow:hidden;border-radius:16px 16px 0 0;">
          <img src="${item.img}" alt="${item.name}"
            style="width:100%;height:100%;object-fit:cover;transition:transform 0.45s ease;"
            onmouseover="this.style.transform='scale(1.07)'"
            onmouseout="this.style.transform='scale(1)'"
            onerror="this.src='https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=400&h=220&fit=crop'">
          <span class="food-veg-badge ${item.type}" style="position:absolute;top:10px;left:10px;"></span>
          ${item.popular ? '<span style="position:absolute;top:10px;right:10px;background:rgba(252,128,25,0.92);color:white;font-size:0.7rem;font-weight:800;padding:3px 8px;border-radius:6px;">🔥 Hot</span>' : ''}
        </div>
        <div class="food-info">
          <div class="food-name">${item.name}</div>
          <div class="food-desc">${item.desc}</div>
          <div class="food-footer">
            <span class="food-price">₹${item.price}</span>
            <button class="add-btn ${inCart ? 'added' : ''}" onclick="handleAddToCart(${item.id})" id="add-btn-${item.id}">
              ${inCart ? '<i class="fas fa-check"></i> Added' : '+ ADD'}
            </button>
          </div>
        </div>`;
      grid.appendChild(card);
    });
  }

  function handleAddToCart(itemId) {
    addToCart(itemId, rid);
    setTimeout(updateFloatingCart, 100);
  }

  function filterMenu(query) {
    const items = (FOOD_ITEMS[rid] || []).filter(i => i.name.toLowerCase().includes(query.toLowerCase()));
    const grid = document.getElementById('menuGrid');
    grid.innerHTML = '';
    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'food-card';
      card.innerHTML = `
        <div style="position:relative;height:170px;overflow:hidden;border-radius:16px 16px 0 0;">
          <img src="${item.img}" alt="${item.name}"
            style="width:100%;height:100%;object-fit:cover;transition:transform 0.45s ease;"
            onmouseover="this.style.transform='scale(1.07)'"
            onmouseout="this.style.transform='scale(1)'"
            onerror="this.src='https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=400&h=220&fit=crop'">
          <span class="food-veg-badge ${item.type}" style="position:absolute;top:10px;left:10px;"></span>
        </div>
        <div class="food-info">
          <div class="food-name">${item.name}</div>
          <div class="food-desc">${item.desc}</div>
          <div class="food-footer">
            <span class="food-price">₹${item.price}</span>
            <button class="add-btn" onclick="handleAddToCart(${item.id})" id="add-btn-${item.id}">+ ADD</button>
          </div>
        </div>`;
      grid.appendChild(card);
    });
  }

  function updateFloatingCart() {
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const bar = document.getElementById('floatingCart');
    if (cart.length > 0) {
      bar.style.display = 'flex';
      document.getElementById('floatingCartCount').textContent = cart.reduce((s, i) => s + i.quantity, 0);
      document.getElementById('floatingCartTotal').textContent = '₹' + cart.reduce((s, i) => s + i.price * i.quantity, 0);
    } else {
      bar.style.display = 'none';
    }
  }

  // Override addToCart to update floating bar
  const _origAdd = addToCart;
</script>
<script src="js/chatbot.js"></script>
</body>
</html>
