<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – SmartFood</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body style="background:white;">

<div class="auth-page">
  <div class="auth-left">
    <div class="auth-food-icons">🔐 📧 🔑</div>
    <h2>Forgot your password?</h2>
    <p>No worries — enter your email, verify the OTP we send you, then set a new password.</p>
  </div>

  <div class="auth-right">
    <div class="auth-form-container">
      <a href="login.html" style="display:inline-flex;align-items:center;gap:8px;color:var(--text-light);text-decoration:none;font-size:0.88rem;font-weight:600;margin-bottom:28px;">
        <i class="fas fa-arrow-left"></i> Back to Sign In
      </a>

      <!-- Step 1: email -->
      <div id="step1">
        <h1>Reset Password</h1>
        <p class="subtitle">Enter the email linked to your account</p>
        <div class="alert" id="alert1"></div>
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-icon">
            <i class="fas fa-envelope"></i>
            <input type="email" class="form-input" id="fpEmail" placeholder="Enter your email">
          </div>
        </div>
        <button class="form-submit" onclick="sendOtp()" id="sendBtn"><i class="fas fa-paper-plane"></i> Send OTP</button>
      </div>

      <!-- Step 2: OTP + new password -->
      <div id="step2" style="display:none;">
        <h1>Enter OTP & New Password</h1>
        <p class="subtitle">Check your email (or server console in dev mode) for the code</p>
        <div class="alert" id="alert2"></div>
        <div class="form-group">
          <label>OTP Code</label>
          <div class="input-icon">
            <i class="fas fa-key"></i>
            <input type="text" class="form-input" id="otpCode" placeholder="6-digit code" maxlength="6">
          </div>
        </div>
        <div class="form-group">
          <label>New Password</label>
          <div class="input-icon">
            <i class="fas fa-lock"></i>
            <input type="password" class="form-input" id="newPassword" placeholder="Min 8 chars, upper, lower, number, symbol">
          </div>
        </div>
        <button class="form-submit" onclick="doReset()" id="resetBtn"><i class="fas fa-check"></i> Reset Password</button>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script>
  let fpEmailValue = '';

  async function sendOtp() {
    const email = document.getElementById('fpEmail').value.trim();
    const alertEl = document.getElementById('alert1');
    if (!email) { alertEl.textContent = 'Please enter your email'; alertEl.className = 'alert alert-error show'; return; }

    const btn = document.getElementById('sendBtn');
    btn.innerHTML = '<span class="loading"></span> Sending...';
    const result = await AUTH.forgotPassword(email);
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send OTP';

    fpEmailValue = email;
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
    TOAST.show(result.message || 'If that email is registered, an OTP has been sent', 'info');
  }

  async function doReset() {
    const otp = document.getElementById('otpCode').value.trim();
    const newPassword = document.getElementById('newPassword').value;
    const alertEl = document.getElementById('alert2');
    if (!otp || !newPassword) { alertEl.textContent = 'Please fill in all fields'; alertEl.className = 'alert alert-error show'; return; }

    const btn = document.getElementById('resetBtn');
    btn.innerHTML = '<span class="loading"></span> Resetting...';
    const result = await AUTH.resetPassword(fpEmailValue, otp, newPassword);

    if (result.success) {
      TOAST.show('Password reset! Please sign in.', 'success');
      setTimeout(() => window.location.href = 'login.html', 1000);
    } else {
      alertEl.textContent = result.message;
      alertEl.className = 'alert alert-error show';
      btn.innerHTML = '<i class="fas fa-check"></i> Reset Password';
    }
  }
</script>
</body>
</html>
