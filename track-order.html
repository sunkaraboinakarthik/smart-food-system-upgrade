<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order – SmartFood</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="logo">
      <div class="logo-icon">🍔</div>
      <span class="logo-text">Smart<span>Food</span></span>
    </a>
    <div class="nav-actions">
      <a href="offers.html" class="nav-btn btn-ghost" style="color:#FC8019;"><i class="fas fa-tag"></i> <span>Offers</span></a>
      <a href="dashboard.html" class="nav-btn btn-ghost" id="dashBtn" style="display:none;"><i class="fas fa-th-large"></i> <span>Dashboard</span></a>
      <a href="login.html" class="nav-btn btn-ghost" id="loginBtn"><i class="fas fa-user"></i> <span>Login</span></a>
      <div id="userMenu" style="display:none;align-items:center;gap:10px;">
        <a href="dashboard.html" style="font-weight:700;font-size:0.9rem;color:var(--text-mid);text-decoration:none;">Hi, <span id="userName"></span>! <i class="fas fa-th-large" style="color:var(--primary);font-size:0.8rem;"></i></a>
        <button class="nav-btn btn-ghost" onclick="AUTH.logout()"><i class="fas fa-sign-out-alt"></i></button>
      </div>
      <a href="cart.html" class="cart-btn">
        <i class="fas fa-shopping-cart"></i> Cart
        <span class="cart-count" id="cartCount" style="display:none;">0</span>
      </a>
    </div>
  </div>
</nav>

<div style="background:linear-gradient(135deg,#1a1a2e,#0f3460);padding:32px 5%;">
  <div style="max-width:1280px;margin:0 auto;">
    <h1 style="color:white;font-family:var(--font-display);font-size:1.8rem;font-weight:800;">Track Your Order 📍</h1>
    <p style="color:rgba(255,255,255,0.6);margin-top:6px;">Real-time updates on your food delivery</p>
  </div>
</div>

<!-- Search by order ID -->
<div style="background:white;padding:20px 5%;box-shadow:var(--shadow-sm);">
  <div style="max-width:600px;margin:0 auto;display:flex;gap:10px;">
    <input type="text" id="orderSearchInput" class="form-input" placeholder="Enter Order ID to track..." style="flex:1;">
    <button class="checkout-btn" style="width:auto;padding:12px 24px;white-space:nowrap;" onclick="searchOrder()">
      <i class="fas fa-search"></i> Track
    </button>
  </div>
</div>

<div class="page-container">
  <div id="trackContainer"></div>
  <div style="margin-top:20px;text-align:center;">
    <a href="index.html" style="color:var(--primary);font-weight:700;text-decoration:none;">← Back to Home</a>
    &nbsp;·&nbsp;
    <a href="restaurants.html" style="color:var(--primary);font-weight:700;text-decoration:none;">Order Again</a>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/menu.js"></script>
<script src="js/cart.js"></script>
<script src="js/orders.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('id');
    if (orderId) {
      document.getElementById('orderSearchInput').value = orderId;
      renderTrackOrder(orderId);
    } else {
      // Show recent orders
      const user = AUTH.getLoggedInUser();
      if (user) {
        const orders = ORDERS.getUserOrders(user.id);
        if (orders.length > 0) {
          renderTrackOrder(orders[0].id);
        } else {
          document.getElementById('trackContainer').innerHTML = `
            <div class="empty-state">
              <span class="empty-icon">📦</span>
              <h3>No Orders Yet</h3>
              <p>Place your first order and track it here!</p>
              <a href="restaurants.html" class="checkout-btn" style="display:inline-block;width:auto;padding:12px 28px;">Order Now</a>
            </div>
          `;
        }
      } else {
        document.getElementById('trackContainer').innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">🔒</span>
            <h3>Login to Track Orders</h3>
            <p>Please log in to view and track your orders</p>
            <a href="login.html" class="checkout-btn" style="display:inline-block;width:auto;padding:12px 28px;">Login</a>
          </div>
        `;
      }
    }
  });

  function searchOrder() {
    const id = document.getElementById('orderSearchInput').value.trim();
    if (id) renderTrackOrder(id);
  }

  // Auto-refresh every 10 seconds
  setInterval(() => {
    const id = document.getElementById('orderSearchInput').value.trim();
    const params = new URLSearchParams(window.location.search);
    const orderId = id || params.get('id');
    if (orderId) renderTrackOrder(orderId);
  }, 10000);
</script>
<script src="js/chatbot.js"></script>
</body>
</html>
